; DroneScan — détecteur de drones Remote ID à DEUX cartes Seeed XIAO ESP32-C6
;
;   ESP 1 « scanner »    : pio run -e scanner -t upload     (branchez UNE carte à la fois pour flasher)
;   ESP 2 « passerelle » : pio run -e gateway -t upload
;   Moniteur série       : pio device monitor
;
; L'ESP32-C6 n'est pris en charge par Arduino que via Arduino-ESP32 3.x : plateforme "pioarduino".

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
; Si la carte "seeed_xiao_esp32c6" n'est pas reconnue, essayez : board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; deux emplacements de programme (mise à jour OTA) + système de fichiers du journal
board_build.partitions = ota_4mb.csv
board_build.filesystem = littlefs
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Iinclude

[env:scanner]
build_src_filter = -<*> +<scanner/>
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.0
build_flags =
    ${env.build_flags}
    ; BLE 5 : scan étendu + PHY « Coded » (Remote ID longue portée)
    -DMYNEWT_VAL_BLE_EXT_ADV=1
    -DMYNEWT_VAL_BLE_EXT_ADV_MAX_SIZE=300
    ; décodeur Open Drone ID sans fonctions d'affichage
    -DODID_DISABLE_PRINTF
    -DODID_AUTH_MAX_PAGES=2

[env:gateway]
build_src_filter = -<*> +<gateway/>
; compresse la page web en gzip avant compilation (gain ~35 Ko de flash)
extra_scripts = pre:tools/gzip_ui.py
lib_deps =
    knolleary/PubSubClient@^2.8
